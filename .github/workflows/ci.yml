name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate Kubernetes YAML
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import glob
          import yaml

          for file in glob.glob("k8s/*.yaml"):
              print(f"Validating {file}")
              with open(file, "r") as f:
                  list(yaml.safe_load_all(f))

          print("All Kubernetes YAML files are valid")
          PY

  build-push:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [api, web]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/emann-salah/garden-${{ matrix.service }}:${{ github.sha }}

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update image tags in k8s manifests
        run: |
          sed -i "s|ghcr.io/emann-salah/garden-api:.*|ghcr.io/emann-salah/garden-api:${{ github.sha }}|" k8s/api-deployment.yaml
          sed -i "s|ghcr.io/emann-salah/garden-web:.*|ghcr.io/emann-salah/garden-web:${{ github.sha }}|" k8s/web-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/api-deployment.yaml k8s/web-deployment.yaml
          git diff --cached --quiet || git commit -m "Initial commit: GitOps voting app"
          git push


