services:
  postgres:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: garden
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: garden-api:v1
    build:
      context: ./api
    depends_on:
      - postgres
    restart: always
    command: gunicorn app:app -b 0.0.0.0:80 --log-file - --access-logfile - --workers 4 --keep-alive 0
    ports:
      - "5000:80"
    environment:
      PGDATABASE: garden
      PGUSER: admin
      PGPASSWORD: 123

  web:
    image: garden-web:v1
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "8081:8080"

volumes:
  postgres_data: