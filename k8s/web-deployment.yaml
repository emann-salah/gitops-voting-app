apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-deployment
  labels:
    app: web

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: ghcr.io/emann-salah/garden-web:44f46c48a3b490c836f665913feddb3991fb0923

          ports:
            - containerPort: 8080

          command:
            - npm

          args:
            - run
            - serve
            - --
            - --host
            - 0.0.0.0


