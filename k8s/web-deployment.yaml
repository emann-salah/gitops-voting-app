apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-deployment
  labels:
    app: web

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: ghcr.io/emann-salah/garden-web:b6b522d9bd7abb9d1e6b781481b69c3df9637636

          ports:
            - containerPort: 8080

          command:
            - npm

          args:
            - run
            - serve
            - --
            - --host
            - 0.0.0.0

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi