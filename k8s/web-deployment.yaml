apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-deployment
  labels:
    app: web

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: ghcr.io/emann-salah/garden-web:04c4ef2f67d1aa321577d47d59232c39ab7425b7

          ports:
            - containerPort: 8080

          command:
            - npm

          args:
            - run
            - serve
            - --
            - --host
            - 0.0.0.0


