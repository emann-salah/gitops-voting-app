apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-deployment
  labels:
    app: web

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: ghcr.io/emann-salah/garden-web:dbd9caeca483e44b7b0cee342b6a80a61bdcb73b

          ports:
            - containerPort: 8080

          command:
            - npm

          args:
            - run
            - serve
            - --
            - --host
            - 0.0.0.0


